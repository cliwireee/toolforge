[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolforge"
dynamic = ["version"]
description = "Progressive MCP tooling that keeps your context lean. Measure, prune, and on-demand load tool definitions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Toolforge Contributors" }
]
keywords = ["mcp", "claude", "claude-code", "cursor", "ai-agents", "context", "tools", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "tiktoken>=0.7",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
# mcp 1.20 added paginated list_tools(params=...); 2.x renamed FastMCP to MCPServer.
mcp = [
    "mcp>=1.20,<3",
]
claude = [
    "anthropic>=0.34",
]

[project.scripts]
toolforge = "toolforge.cli.main:app"

[project.urls]
Homepage = "https://github.com/cliwireee/toolforge"
Repository = "https://github.com/cliwireee/toolforge"
Issues = "https://github.com/cliwireee/toolforge/issues"
Documentation = "https://github.com/cliwireee/toolforge#readme"

[tool.hatch.version]
path = "src/toolforge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/toolforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "real_tokenizer: needs the real cl100k_base vocabulary (skipped offline, required in CI)",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/toolforge"]
